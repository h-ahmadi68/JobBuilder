spring:
  application:
    name: JobBuilder
server:
  port: 8082

flink:
  job-manager:
    host: localhost
    port: 8081
  job-jar-path: target/JobBuilder-0.0.1-SNAPSHOT-flink-job.jar

flink-job:
  kafka:
    bootstrap-servers: kafka:29092
    source-topic: payment_events
  redis:
    host: redis
    port: 6379